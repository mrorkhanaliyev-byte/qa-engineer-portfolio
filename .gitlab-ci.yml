# ============================================================
# GitLab CI — MANUAL-trigger mirror of the fast, headless suites.
#
# This portfolio is dual-hosted (GitHub + GitLab). All automated CI runs
# on **GitHub Actions** (6 path-scoped workflows, incl. browser E2E).
#
# This file is a GitLab-native mirror of the dependency-light suites
# (SQL, Newman API, k6 smoke) kept to demonstrate GitLab CI authoring.
# It is set to **manual trigger only** ("Run pipeline" in the GitLab UI)
# so it never auto-runs on push: GitLab.com free-tier shared runners
# require one-time account identity verification before they execute, and
# we don't want red auto-pipelines on every commit. Once shared runners
# are enabled on the account, click **Build → Pipelines → Run pipeline**
# (branch: main) and all three jobs run green.
#
# Jobs:
#   • sql-validation — SQLite query harness (Python stdlib only)
#   • newman-api     — both Postman collections via Newman
#   • k6-smoke       — k6 performance smoke test (1 VU)
# ============================================================

stages:
  - test

# Only create a pipeline when triggered MANUALLY from the GitLab UI
# (source == "web"). Pushes and merge requests do NOT auto-create a
# pipeline — so no failed pipelines pile up while runners are disabled.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

sql-validation:
  stage: test
  image: python:3.12-slim
  script:
    - cd 03-sql-queries
    - python -c "import sqlite3; print('sqlite3', sqlite3.sqlite_version)"
    - python scripts/run_all_queries.py

newman-api:
  stage: test
  image: node:20-slim
  script:
    - cd 04-postman-api-testing
    - npm ci
    # --env-var CI=true makes the verifyLogin (valid creds) test skip
    # itself when AE's user is not provisioned — same as on GitHub.
    - npm test

k6-smoke:
  stage: test
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    - cd 08-performance-k6
    # Smoke ONLY — never run load/stress in CI against a public server.
    - k6 run tests/smoke.js
